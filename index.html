*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#141414;color:#f0f0f0;font-family:system-ui,-apple-system,sans-serif;font-size:14px;min-height:100vh}

.tabs{display:flex;gap:2px;padding:0.75rem 1rem 0;overflow-x:auto;scrollbar-width:none}

.tab-btn{padding:7px 14px;border-radius:6px 6px 0 0;border:none;background:transparent;color:rgba(255,255,255,0.4);font-size:13px;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all 0.15s;border-bottom:2px solid transparent}
.tab-btn:hover{color:rgba(255,255,255,0.75);background:rgba(255,255,255,0.04)}
.tab-btn.active{color:#f0f0f0;background:rgba(255,255,255,0.07);border-bottom:2px solid #4ade80}
.tab-btn.tab-resumen.active{border-bottom-color:#60a5fa}
.content{padding:1.25rem 1rem}
.section-label{font-size:10px;font-weight:600;letter-spacing:0.1em;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:10px;margin-top:1.5rem}

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:0.5rem}
.kpi-card{background:#1f1f1f;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:14px 16px}
.kpi-label{font-size:11px;color:rgba(255,255,255,0.45);margin-bottom:6px}
.kpi-value{font-size:22px;font-weight:500}
.kpi-sub{font-size:11px;margin-top:5px;color:rgba(255,255,255,0.35)}
.kpi-green{background:rgba(74,222,128,0.08);border-color:rgba(74,222,128,0.2)}.kpi-green .kpi-value{color:#4ade80}.kpi-green .kpi-label{color:rgba(74,222,128,0.7)}

.kpi-neutral .kpi-value{color:#f0f0f0}
.meta-block{background:#1f1f1f;border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.meta-title{font-size:10px;font-weight:600;letter-spacing:0.09em;color:rgba(255,255,255,0.3);text-transform:uppercase;margin-bottom:10px}
.meta-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,0.05);font-size:13px}
.meta-row:last-child{border-bottom:none}
.meta-row .lbl{color:rgba(255,255,255,0.5)}
.meta-row .val{font-weight:500;color:#f0f0f0}
.meta-row .val.green{color:#4ade80}
.meta-row .val.amber{color:#fbbf24}
.total-row{border-top:1px solid rgba(255,255,255,0.1)!important;margin-top:4px;padding-top:8px!important}.total-row .lbl{color:rgba(255,255,255,0.7)!important;font-weight:500}.total-row .val{color:#f0f0f0!important;font-weight:600}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:520px){.two-col{grid-template-columns:1fr}}
.goal-row{margin-bottom:12px}
.goal-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;font-size:13px}
.goal-header .name{color:rgba(255,255,255,0.6)}

.badge-amber{background:rgba(251,191,36,0.12);color:#fbbf24}

.summary-note{font-size:12px;color:rgba(255,255,255,0.3);margin-top:12px;font-style:italic}
.divider{border:none;border-top:1px solid rgba(255,255,255,0.06);margin:1.25rem 0}

  return `<span class="${cls}">${txt}</span>`;

function renderResumen(){
  if(REVISIONES.length===0) return '<p style="color:rgba(255,255,255,0.4);padding:2rem 0;">No hay revisiones cargadas aún.</p>';
  const last=REVISIONES[REVISIONES.length-1];

      <td>${r.fecha}</td>
      <td>${fmt(r.facturacion)}</td>
      <td>${fmt(r.gastos)}</td>
      <td style="color:#4ade80">${fmt(r.utilidad)}</td>
      <td><span class="badge ${badgeClass(r.ocupacion)}"><span class="dot ${dotClass(r.ocupacion)}"></span>${(r.ocupacion*100).toFixed(1)}%</span></td>
      <td>${fmt(r.balanceBancario)}</td>
    </tr>`).join('');

  // Tabla histórico invertida (más reciente primero)
  const histInv = [...HISTORICO].reverse();
  const histRows = histInv.map(h=>{
    const uColor = h.utilidad>=0?'#4ade80':'#f87171';
    const uSign = h.utilidad>=0?'+':'';
    const maxVal = Math.max(...HISTORICO.map(x=>x.ingresos));
    const barW = Math.round((h.ingresos/maxVal)*100);
    const eBarW = Math.round((h.egresos/maxVal)*100);

      <td style="white-space:nowrap;color:rgba(255,255,255,0.5);font-size:12px">${h.mes}</td>

        <div style="display:flex;align-items:center;gap:6px">

        </div>
      </td>

          <div style="flex:1;background:rgba(255,255,255,0.05);border-radius:2px;height:5px;min-width:60px">

          <span style="font-size:12px;min-width:70px;text-align:right">${fmt(h.egresos)}</span>
        </div>
      </td>
      <td style="font-size:13px;font-weight:500;color:${uColor};text-align:right">${uSign}${fmt(h.utilidad)}</td>
    </tr>`;
  }).join('');

  const totalEgresos = HISTORICO.reduce((s,h)=>s+h.egresos,0);
  const totalUtilidad = HISTORICO.reduce((s,h)=>s+h.utilidad,0);
  const mesesPositivos = HISTORICO.filter(h=>h.utilidad>0).length;

function drawHistChart(){
  const canvas = document.getElementById('histChart');
  if(!canvas) return;
  const dpr = window.devicePixelRatio||1;
  const W = canvas.parentElement.clientWidth - 32;
  const H = 260;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = W+'px';
  canvas.style.height = H+'px';
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const data = HISTORICO;
  const n = data.length;
  const padL=52, padR=60, padT=20, padB=40;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;

  const maxBar = Math.max(...data.map(d=>Math.max(d.ingresos,d.egresos)));
  const minUtil = Math.min(...data.map(d=>d.utilidad));
  const maxUtil = Math.max(...data.map(d=>d.utilidad));
  const utilRange = maxUtil - minUtil;
  const barW = chartW / n;
  const grpW = barW * 0.72;
  const bW = grpW / 2;

  // Grid lines (left axis)
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1;
  for(let i=0;i<=4;i++){
    const y = padT + chartH * (i/4);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(padL+chartW, y); ctx.stroke();
    const val = maxBar * (1 - i/4);
    ctx.fillStyle='rgba(255,255,255,0.3)';
    ctx.font='10px system-ui';
    ctx.textAlign='right';
    ctx.fillText('$'+Math.round(val/1000)+'k', padL-6, y+4);
  }

  // Right axis labels (utilidad)
  ctx.textAlign='left';
  for(let i=0;i<=4;i++){
    const val = minUtil + utilRange*(i/4);
    const y = padT + chartH*(1 - i/4);
    ctx.fillStyle='rgba(147,197,253,0.45)';
    ctx.font='10px system-ui';
    ctx.fillText((val>=0?'+':'')+Math.round(val/1000)+'k', padL+chartW+6, y+4);
  }

  // Zero line for utilidad (right axis)
  const zeroY = padT + chartH * (1 - (0-minUtil)/utilRange);
  ctx.strokeStyle='rgba(147,197,253,0.15)';
  ctx.setLineDash([3,3]);
  ctx.beginPath(); ctx.moveTo(padL, zeroY); ctx.lineTo(padL+chartW, zeroY); ctx.stroke();
  ctx.setLineDash([]);

  // Bars
  data.forEach((d,i)=>{
    const x = padL + i*barW + (barW-grpW)/2;
    // Ingresos
    const iH = (d.ingresos/maxBar)*chartH;
    ctx.fillStyle='rgba(74,222,128,0.75)';
    ctx.fillRect(x, padT+chartH-iH, bW, iH);
    // Egresos
    const eH = (d.egresos/maxBar)*chartH;
    ctx.fillStyle='rgba(251,146,60,0.75)';
    ctx.fillRect(x+bW, padT+chartH-eH, bW, eH);
  });

  // Utilidad line
  ctx.strokeStyle='#93c5fd';
  ctx.lineWidth=2;
  ctx.lineJoin='round';
  ctx.beginPath();
  data.forEach((d,i)=>{
    const x = padL + i*barW + barW/2;
    const y = padT + chartH*(1-(d.utilidad-minUtil)/utilRange);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.stroke();

  // Dots on line
  data.forEach((d,i)=>{
    const x = padL + i*barW + barW/2;
    const y = padT + chartH*(1-(d.utilidad-minUtil)/utilRange);
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI*2);
    ctx.fillStyle = d.utilidad>=0?'#4ade80':'#f87171';
    ctx.fill();
    ctx.strokeStyle='#1f1f1f'; ctx.lineWidth=1.5; ctx.stroke();
  });

  // X labels
  ctx.fillStyle='rgba(255,255,255,0.35)';
  ctx.font='10px system-ui';
  ctx.textAlign='center';
  data.forEach((d,i)=>{
    const x = padL + i*barW + barW/2;
    const lbl = d.mes.replace(' ','\\n').split(' ');
    ctx.fillText(lbl[0], x, padT+chartH+14);
    if(lbl[1]) ctx.fillText(lbl[1], x, padT+chartH+25);
  });
}

let activeTab = 'resumen';

function render(){
  const tabsEl=document.getElementById('tabs');
  const contentEl=document.getElementById('content');

  // Build tabs
  let tabsHTML=`<button class="tab-btn tab-resumen${activeTab==='resumen'?' active':''}" onclick="switchTab('resumen')">Resumen general</button>`;
  REVISIONES.forEach(r=>{
    tabsHTML+=`<button class="tab-btn${activeTab===r.id?' active':''}" onclick="switchTab('${r.id}')">${r.label}</button>`;
  });
  tabsEl.innerHTML=tabsHTML;

  // Build content
  if(activeTab==='resumen'){
    contentEl.innerHTML=renderResumen();
  } else {
    const rev=REVISIONES.find(r=>r.id===activeTab);
    if(rev) contentEl.innerHTML=renderRevision(rev);
  }
}

function switchTab(id){
  activeTab=id;
  render();
  if(id==='resumen') setTimeout(drawHistChart, 50);
}
