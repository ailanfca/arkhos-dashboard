<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tickets ARKHOS</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script>
    // Lucide como componentes React
    const createIcon = (name) => ({ size = 16, className = "" } = {}) =>
      React.createElement("i", {
        "data-lucide": name,
        style: { width: size, height: size, display:"inline-block" },
        className
      });
  </script>
</head>
<body class="bg-slate-900">
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxT0jDzl0UnUfRt_C8WgPDbnr2UqGPV_msGociIwq9DfTedmAqgM1SJo2CpEX74ALqLSg/exec";

const ROLES = {
  ADMIN:      { name: "ADMINISTRADOR", color: "from-red-600 to-red-700",    permissions: ["create","edit","delete","assign","view_all","escalate","manage_users"] },
  SUPERVISOR: { name: "SUPERVISOR",    color: "from-blue-600 to-blue-700",   permissions: ["create","edit","assign","view_team","escalate"] },
  TECHNICIAN: { name: "TÉCNICO",       color: "from-green-600 to-green-700", permissions: ["create","view_own","update_own"] }
};

const STATUS = {
  OPEN:        { label: "Abierto",     color: "bg-red-100 text-red-800",        icon: "🔴" },
  IN_PROGRESS: { label: "En Progreso", color: "bg-yellow-100 text-yellow-800",  icon: "🟡" },
  WAITING:     { label: "Esperando",   color: "bg-blue-100 text-blue-800",      icon: "🔵" },
  COMPLETED:   { label: "Completado",  color: "bg-green-100 text-green-800",    icon: "🟢" },
  CANCELLED:   { label: "Cancelado",   color: "bg-gray-100 text-gray-800",      icon: "⚫" }
};

const USERS = [
  { id: 1, name: "Octavio", role: "ADMIN",      area: "Dirección General" },
  { id: 2, name: "Ailan",   role: "ADMIN",      area: "Administración" },
  { id: 3, name: "Liz",     role: "SUPERVISOR", area: "Logística/Limpieza" },
  { id: 4, name: "Hugo",    role: "TECHNICIAN", area: "Mantenimiento" }
];

function jsonp(url) {
  return new Promise((resolve, reject) => {
    const cb = "cb_" + Date.now();
    const s  = document.createElement("script");
    s.src    = `${url}&callback=${cb}`;
    window[cb] = (data) => { delete window[cb]; document.body.removeChild(s); resolve(data); };
    s.onerror  = () => { delete window[cb]; document.body.removeChild(s); reject(new Error("JSONP error")); };
    document.body.appendChild(s);
  });
}

async function apiGet() {
  // Intentar fetch directo primero (funciona en Chrome/Firefox)
  try {
    const res = await fetch(`${SCRIPT_URL}?action=getAll`, { redirect: "follow" });
    const json = await res.json();
    return json.tickets || [];
  } catch {
    // Fallback JSONP para Safari iOS
    return new Promise((resolve) => {
      const cb = "cb_" + Date.now();
      const s  = document.createElement("script");
      s.src    = `${SCRIPT_URL}?action=getAll&callback=${cb}`;
      window[cb] = (data) => {
        delete window[cb];
        if (document.body.contains(s)) document.body.removeChild(s);
        resolve(data.tickets || []);
      };
      s.onerror = () => {
        delete window[cb];
        if (document.body.contains(s)) document.body.removeChild(s);
        resolve([]);
      };
      document.body.appendChild(s);
    });
  }
}

function apiSave(tickets) {
  const data = encodeURIComponent(JSON.stringify(tickets));
  return jsonp(`${SCRIPT_URL}?action=save&data=${data}`);
}

function Badge({ s }) {
  const st = STATUS[s] || { label: s, color: "bg-gray-100 text-gray-800", icon: "⚪" };
  return (
    <span className={`px-2 py-1 rounded text-xs font-semibold ${st.color}`}>
      {st.icon} {st.label}
    </span>
  );
}

function App() {
  const [user,     setUser]     = useState(null);
  const [tickets,  setTickets]  = useState([]);
  const [view,     setView]     = useState("dashboard");
  const [syncing,  setSyncing]  = useState(false);
  const [online,   setOnline]   = useState(null);   // null = no intentado aún
  const [lastSync, setLastSync] = useState(null);
  const [form,     setForm]     = useState({
    title:"", description:"", priority:"normal",
    assignedTo:"", location:"", category:"maintenance"
  });

    const loadTickets = useCallback(async () => {
    setSyncing(true);
    try {
      const data = await apiGet();
      setTickets(data.map(parseRow));
      setOnline(true);
      setLastSync(new Date().toLocaleTimeString("es-MX"));
    } catch {
      setOnline(false);
    } finally {
      setSyncing(false);
    }
  }, []);

  useEffect(() => { if (user) loadTickets(); }, [user, loadTickets]);

  // Auto-refresh cada 30 segundos
  useEffect(() => {
    if (!user) return;
    const interval = setInterval(() => loadTickets(), 30000);
    return () => clearInterval(interval);
  }, [user, loadTickets]);

  const persist = async (updated) => {
    setTickets(updated);
    setSyncing(true);
    try {
      await apiSave(updated.map(t => ({
        TicketNumber: t.ticketNumber,
        Title:        t.title,
        Status:       t.status,
        Priority:     t.priority,
        CreatedBy:    t.createdBy,
        CreatedAt:    t.createdAt,
        AssignedTo:   t.assignedTo,
        CompletedBy:  t.completedBy || "",
        CompletedAt:  t.completedAt || "",
        Location:     t.location,
        Category:     t.category,
        Description:  t.description,
      })));
      // Con no-cors asumimos éxito si no hay excepción
      setOnline(true);
      setLastSync(new Date().toLocaleTimeString("es-MX"));
    } catch(err) {
      console.error("Save error:", err);
      setOnline(false);
    } finally {
      setSyncing(false);
    }
  };

  const can = (p) => user && ROLES[user.role].permissions.includes(p);

  const visible = () => tickets; // Todos ven todos los tickets

  const createTicket = async () => {
    if (!form.title || !form.assignedTo) { alert("Completa título y asignado"); return; }
    // Recargar primero para tener el estado más reciente de Sheets
    setSyncing(true);
    let latest = tickets;
    try {
      const data = await apiGet();
      latest = data.map(r => ({
        id: r.TicketNumber || String(Date.now()),
        ticketNumber: r.TicketNumber || "", title: r.Title || "",
        status: r.Status || "OPEN", priority: r.Priority || "normal",
        createdBy: r.CreatedBy || "", createdAt: r.CreatedAt || "",
        assignedTo: r.AssignedTo || "", completedBy: r.CompletedBy || "",
        completedAt: r.CompletedAt || "", location: r.Location || "",
        category: r.Category || "", description: r.Description || "",
      }));
      setTickets(latest);
    } catch { /* usar tickets locales si falla */ }
    finally { setSyncing(false); }

    const t = {
      id:           Date.now(),
      ticketNumber: `TKT-${String(latest.length + 1).padStart(5,"0")}`,
      ...form,
      status:      "OPEN",
      createdBy:   user.name,
      createdAt:   new Date().toLocaleString("es-MX"),
      completedBy: "",
      completedAt: "",
    };
    await persist([t, ...latest]);
    setForm({ title:"", description:"", priority:"normal", assignedTo:"", location:"", category:"maintenance" });
    setView("tickets");
  };

  const parseRow = (r) => ({
    id:           r.TicketNumber || "",   // id = ticketNumber siempre
    ticketNumber: r.TicketNumber || "",
    title:        r.Title        || "",
    status:       r.Status       || "OPEN",
    priority:     r.Priority     || "normal",
    createdBy:    r.CreatedBy    || "",
    createdAt:    r.CreatedAt    || "",
    assignedTo:   r.AssignedTo   || "",
    completedBy:  r.CompletedBy  || "",
    completedAt:  r.CompletedAt  || "",
    location:     r.Location     || "",
    category:     r.Category     || "",
    description:  r.Description  || "",
  });

  const getFreshTickets = async () => {
    try {
      const data = await apiGet();
      return data.map(parseRow);
    } catch { return tickets; }
  };

  const completeTicket = async (id) => {
    const latest = await getFreshTickets();
    const updated = latest.map(t => t.id === id
      ? { ...t, status:"COMPLETED", completedBy: user.name, completedAt: new Date().toLocaleString("es-MX") }
      : t);
    setTickets(updated);
    await persist(updated);
  };

  const deleteTicket = async (id) => {
    if (!can("delete")) return;
    if (!window.confirm("¿Eliminar este ticket?")) return;
    const latest = await getFreshTickets();
    await persist(latest.filter(t => t.id !== id));
  };

  const SyncBadge = () => {
    if (online === null) return null;
    return (
      <div className={`flex items-center gap-1 text-xs px-3 py-1 rounded-full font-medium
        ${syncing ? "bg-yellow-700 text-yellow-200" : online ? "bg-green-800 text-green-200" : "bg-red-800 text-red-200"}`}>
        {syncing ? "⟳ Sincronizando…" : online ? `✓ Sync ${lastSync}` : "✗ Sin conexión"}
      </div>
    );
  };

  const Nav = () => (
    <div className="bg-slate-700 text-white px-4 py-3 flex flex-wrap gap-2 items-center">
      {[["dashboard","📊 Dashboard"],["tickets","🎫 Tickets"],["create","➕ Crear"]].map(([v,l]) => (
        <button key={v} onClick={() => setView(v)}
          className={`px-4 py-1.5 rounded font-medium text-sm transition
            ${view===v ? "bg-blue-600" : "bg-slate-600 hover:bg-slate-500"}`}>
          {l}
        </button>
      ))}
      {user?.role === "ADMIN" && (
        <button onClick={() => setView("admin")}
          className={`px-4 py-1.5 rounded font-medium text-sm transition
            ${view==="admin" ? "bg-red-600" : "bg-slate-600 hover:bg-slate-500"}`}>
          ⚙️ Admin
        </button>
      )}
      <div className="ml-auto"><SyncBadge/></div>
    </div>
  );

  const Header = ({ title }) => (
    <div className="bg-gradient-to-r from-slate-800 to-slate-700 text-white p-4 shadow-lg">
      <div className="max-w-5xl mx-auto flex justify-between items-center">
        <div>
          <h1 className="text-2xl font-bold">{title}</h1>
          <p className="text-slate-400 text-sm mt-0.5">Urban Nest · ARKHOS</p>
        </div>
        <div className="text-right">
          <span className={`inline-block px-3 py-1 rounded font-semibold text-sm bg-gradient-to-r ${ROLES[user.role].color}`}>
            {ROLES[user.role].name}
          </span>
          <p className="text-slate-300 text-sm mt-1">{user.name}</p>
          <button onClick={() => { setUser(null); setTickets([]); setView("dashboard"); }}
            className="mt-1 px-3 py-1 bg-red-700 hover:bg-red-600 rounded text-xs ml-auto block">
            ↩ Salir
          </button>
        </div>
      </div>
    </div>
  );

  // ── LOGIN ──
  if (!user) return (
    <div className="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800 flex items-center justify-center p-4">
      <div className="bg-slate-700 rounded-xl shadow-2xl p-8 w-full max-w-sm">
        <h1 className="text-2xl font-bold text-white text-center mb-1">🎫 TICKETS ARKHO</h1>
        <p className="text-slate-400 text-center text-sm mb-6">Gestión de Limpieza y Mantenimiento</p>
        <div className="space-y-3">
          {USERS.map(u => (
            <button key={u.id} onClick={() => { setUser(u); setView("dashboard"); }}
              className="w-full p-4 bg-slate-600 hover:bg-slate-500 text-white rounded-lg transition text-left">
              <p className="font-semibold">{u.name}</p>
              <p className="text-xs text-slate-400">{ROLES[u.role].name} · {u.area}</p>
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  const vt = visible();

  // ── DASHBOARD ──
  if (view === "dashboard") {
    const stats = {
      total:      vt.length,
      open:       vt.filter(t => t.status === "OPEN").length,
      inProgress: vt.filter(t => t.status === "IN_PROGRESS").length,
      completed:  vt.filter(t => t.status === "COMPLETED").length
    };
    const mine = vt.filter(t => t.assignedTo === user.name && t.status !== "COMPLETED");
    return (
      <div className="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800">
        <Header title="Dashboard"/>
        <Nav/>
        <div className="max-w-5xl mx-auto p-6 space-y-6">
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
            {[["Total","text-blue-400",stats.total],["Abiertos","text-red-400",stats.open],
              ["En Progreso","text-yellow-400",stats.inProgress],["Completados","text-green-400",stats.completed]
            ].map(([l,c,v]) => (
              <div key={l} className="bg-slate-700 p-5 rounded-lg text-white shadow">
                <p className="text-xs text-slate-400">{l}</p>
                <p className={`text-4xl font-bold mt-1 ${c}`}>{v}</p>
              </div>
            ))}
          </div>
          <div className="bg-slate-700 rounded-lg p-6 text-white">
            <h2 className="font-bold text-lg mb-4">Pendientes asignados a ti ({mine.length})</h2>
            {mine.length === 0
              ? <p className="text-slate-400 text-sm">Sin tickets pendientes</p>
              : mine.map(t => (
                  <div key={t.id} className="flex justify-between items-center bg-slate-600 p-3 rounded mb-2">
                    <div>
                      <p className="font-semibold text-sm">{t.ticketNumber}: {t.title}</p>
                      <p className="text-xs text-slate-400">{t.location} · {t.createdAt}</p>
                    </div>
                    <Badge s={t.status}/>
                  </div>
                ))
            }
          </div>
        </div>
      </div>
    );
  }

  // ── TICKETS ──
  if (view === "tickets") return (
    <div className="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800">
      <Header title={`Tickets (${vt.length})`}/>
      <Nav/>
      <div className="max-w-5xl mx-auto p-6 space-y-4">
        {syncing && <p className="text-slate-400 text-sm text-center animate-pulse">Cargando desde Google Sheets…</p>}
        {!syncing && vt.length === 0 && (
          <div className="bg-slate-700 text-slate-300 p-10 rounded-lg text-center">No hay tickets registrados</div>
        )}
        {vt.map(t => (
          <div key={t.id} className="bg-slate-700 text-white p-5 rounded-lg shadow">
            <div className="flex justify-between items-start mb-3">
              <div>
                <p className="font-bold">{t.ticketNumber}: {t.title}</p>
                <p className="text-xs text-slate-400">Por {t.createdBy} · {t.createdAt}</p>
              </div>
              <Badge s={t.status}/>
            </div>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-sm mb-3">
              <p><span className="text-slate-400">Asignado:</span> {t.assignedTo}</p>
              <p><span className="text-slate-400">Prioridad:</span> {t.priority}</p>
              <p><span className="text-slate-400">Ubicación:</span> {t.location}</p>
              <p><span className="text-slate-400">Categoría:</span> {t.category}</p>
            </div>
            {t.description && (
              <p className="text-sm text-slate-300 bg-slate-600 p-2 rounded mb-3">{t.description}</p>
            )}
            {t.completedAt && (
              <p className="text-xs text-green-400 mb-3">✅ Completado por {t.completedBy} · {t.completedAt}</p>
            )}
            <div className="flex gap-2 flex-wrap">
              {t.status !== "COMPLETED" && t.assignedTo === user.name && (
                <button onClick={() => completeTicket(t.id)}
                  className="px-3 py-1.5 bg-green-600 hover:bg-green-700 rounded text-sm font-semibold">
                  ✓ Completar
                </button>
              )}
              {can("delete") && (
                <button onClick={() => deleteTicket(t.id)}
                  className="px-3 py-1.5 bg-red-700 hover:bg-red-600 rounded text-sm">
                  🗑 Eliminar
                </button>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );

  // ── CREAR ──
  if (view === "create") return (
    <div className="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800">
      <Header title="Crear Ticket"/>
      <Nav/>
      <div className="max-w-2xl mx-auto p-6">
        <div className="bg-slate-700 text-white p-8 rounded-lg shadow-lg space-y-5">
          <div>
            <label className="block text-sm font-semibold mb-1">Título *</label>
            <input value={form.title} onChange={e => setForm({...form, title: e.target.value})}
              className="w-full px-3 py-2 rounded bg-slate-600 border border-slate-500 focus:border-blue-500 focus:outline-none"
              placeholder="Ej: Reparar puerta entrada Creta 3"/>
          </div>
          <div>
            <label className="block text-sm font-semibold mb-1">Descripción</label>
            <textarea value={form.description} onChange={e => setForm({...form, description: e.target.value})}
              className="w-full px-3 py-2 rounded bg-slate-600 border border-slate-500 focus:border-blue-500 focus:outline-none h-20"
              placeholder="Detalles adicionales…"/>
          </div>
          <div className="grid grid-cols-2 gap-4">
            <div>
              <label className="block text-sm font-semibold mb-1">Asignado a *</label>
              <select value={form.assignedTo} onChange={e => setForm({...form, assignedTo: e.target.value})}
                className="w-full px-3 py-2 rounded bg-slate-600 border border-slate-500 focus:border-blue-500 focus:outline-none">
                <option value="">Selecciona…</option>
                {USERS.filter(u => u.role !== "ADMIN").map(u =>
                  <option key={u.id} value={u.name}>{u.name} ({u.area})</option>
                )}
              </select>
            </div>
            <div>
              <label className="block text-sm font-semibold mb-1">Prioridad</label>
              <select value={form.priority} onChange={e => setForm({...form, priority: e.target.value})}
                className="w-full px-3 py-2 rounded bg-slate-600 border border-slate-500 focus:border-blue-500 focus:outline-none">
                {["baja","normal","alta","urgente"].map(p =>
                  <option key={p} value={p}>{p.charAt(0).toUpperCase()+p.slice(1)}</option>
                )}
              </select>
            </div>
            <div>
              <label className="block text-sm font-semibold mb-1">Ubicación</label>
              <input value={form.location} onChange={e => setForm({...form, location: e.target.value})}
                className="w-full px-3 py-2 rounded bg-slate-600 border border-slate-500 focus:border-blue-500 focus:outline-none"
                placeholder="Creta 3, Áurea 1…"/>
            </div>
            <div>
              <label className="block text-sm font-semibold mb-1">Categoría</label>
              <select value={form.category} onChange={e => setForm({...form, category: e.target.value})}
                className="w-full px-3 py-2 rounded bg-slate-600 border border-slate-500 focus:border-blue-500 focus:outline-none">
                {[["maintenance","Mantenimiento"],["cleaning","Limpieza"],["repair","Reparación"],
                  ["construction","Construcción"],["other","Otro"]].map(([v,l]) =>
                  <option key={v} value={v}>{l}</option>
                )}
              </select>
            </div>
          </div>
          <button onClick={createTicket} disabled={syncing}
            className="w-full py-3 bg-gradient-to-r from-green-600 to-green-700 hover:from-green-700 hover:to-green-800 font-bold rounded-lg transition disabled:opacity-50">
            {syncing ? "Guardando en Sheets…" : "🚀 Crear Ticket"}
          </button>
        </div>
      </div>
    </div>
  );

  // ── ADMIN ──
  if (view === "admin" && user.role === "ADMIN") {
    const pct = tickets.length > 0
      ? Math.round((tickets.filter(t => t.status==="COMPLETED").length / tickets.length) * 100)
      : 0;
    return (
      <div className="min-h-screen bg-gradient-to-br from-slate-900 to-slate-800">
        <Header title="Panel Admin"/>
        <Nav/>
        <div className="max-w-5xl mx-auto p-6 space-y-6">
          <div className="bg-slate-700 text-white p-6 rounded-lg">
            <h2 className="font-bold text-lg mb-3">Google Sheets</h2>
            <p className="text-slate-400 text-xs mb-2">Script conectado:</p>
            <code className="text-xs text-green-400 break-all bg-slate-800 p-2 rounded block">{SCRIPT_URL}</code>
            <button onClick={loadTickets} disabled={syncing}
              className="mt-4 px-5 py-2 bg-blue-600 hover:bg-blue-700 rounded font-semibold text-sm disabled:opacity-50">
              {syncing ? "⟳ Cargando…" : "↺ Recargar desde Sheets"}
            </button>
          </div>
          <div className="bg-slate-700 text-white p-6 rounded-lg">
            <h2 className="font-bold text-lg mb-4">Usuarios ({USERS.length})</h2>
            <table className="w-full text-sm">
              <thead className="bg-slate-600"><tr>
                {["Nombre","Rol","Área"].map(h =>
                  <th key={h} className="px-4 py-2 text-left">{h}</th>
                )}
              </tr></thead>
              <tbody>
                {USERS.map(u => (
                  <tr key={u.id} className="border-t border-slate-600">
                    <td className="px-4 py-2">{u.name}</td>
                    <td className="px-4 py-2">
                      <span className={`px-2 py-0.5 rounded text-xs font-semibold bg-gradient-to-r ${ROLES[u.role].color}`}>
                        {ROLES[u.role].name}
                      </span>
                    </td>
                    <td className="px-4 py-2 text-slate-400">{u.area}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          <div className="bg-slate-700 text-white p-6 rounded-lg">
            <h2 className="font-bold text-lg mb-4">📊 Resumen</h2>
            <div className="grid grid-cols-3 gap-4">
              {[["Total", tickets.length, "text-blue-400"],
                ["Completados", tickets.filter(t=>t.status==="COMPLETED").length, "text-green-400"],
                ["Completitud", `${pct}%`, "text-yellow-400"]
              ].map(([l,v,c]) => (
                <div key={l} className="bg-slate-600 p-4 rounded text-center">
                  <p className="text-slate-400 text-xs mb-1">{l}</p>
                  <p className={`text-3xl font-bold ${c}`}>{v}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    );
  }

  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
